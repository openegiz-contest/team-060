# Aktogay-type open pit: an overlay on deploy/compose/docker-compose.yml.
# Started by `make pit` from the repository root.

services:
  pit-setup:
    build: ../../team/pit
    image: teamspirit/aktogay-pit:local
    restart: "no"
    command: ["python", "setup_twins.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully

  # Same image as pit-setup (only one service may build a given image).
  pit-simulator:
    image: teamspirit/aktogay-pit:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "simulator.py"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      SIM_SPEEDUP: ${PIT_SPEEDUP:-6}
    depends_on:
      pit-setup:
        condition: service_completed_successfully

  pit-console:
    image: teamspirit/aktogay-pit:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    command: ["python", "web.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      WEB_PORT: "8095"
    ports:
      - "${OPENEGIZ_BIND:-127.0.0.1}:${PIT_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      pit-setup:
        condition: service_completed_successfully

  grafana:
    volumes:
      - ../../team/pit/dashboard.json:/var/lib/grafana/example-dashboards/aktogay-pit.json:ro
